async function emit(lines,fast){busy=true;for(const l of lines){add(l);if(!reduce)await sleep(fast?8:22)}busy=false;cmd.focus({preventScroll:true})}
async function run(raw){
  const t=raw.trim(),adv=TOUR.on&&(!t||/^(n|next)$/i.test(t))&&TOUR.i+1<TOUR.steps.length;add(`<span class="w">C:\\Users\\Visitor&gt;</span> ${esc(adv?TOUR.steps[TOUR.i+1]:raw)}`);
  if(TOUR.on&&(!t||/^(n|next|q|quit)$/i.test(t))){
    if(/^q/i.test(t)){TOUR.on=false;return emit(['','Tour ended. Type '+C('help')+' to explore on your own.'])}
    TOUR.i++;
    if(TOUR.i>=TOUR.steps.length){TOUR.on=false;return emit(['','<span class="ok">That is the tour.</span> Type '+C('help')+' to explore on your own, or '+C('resume')+' for my resume.'])}
    let r=CMDS[TOUR.steps[TOUR.i]]();if(String(r[r.length-1]).includes('next:'))r=r.slice(0,-2);
    return emit([...r,'',D(`stop ${TOUR.i+1} of ${TOUR.steps.length} · Enter for next, q to quit`)])}
  if(!t)return;
  hist.push(t);hi=hist.length;
  let [n,...r]=t.split(/\s+/);n=n.toLowerCase();const a=r.join(' ');n=ALIAS[n]||n;
  const f=CMDS[n];
  if(!f)return emit([`<span class="err">'${esc(n)}' is not recognized as a command.</span>`,`Type ${C('help')} to see what's available.`]);
  if(n!=='clear')try{history.replaceState(null,'','#'+encodeURIComponent(t))}catch(e){}
  const res=await f(a);await emit(res);
}
