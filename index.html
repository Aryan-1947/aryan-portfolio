:root{--page:#E9ECF1;--win:#FFFFFF;--fg:#23262E;--dim:#7A8190;--w:#0B0D12;--hl:#1D63D6;--ok:#16874D;--err:#C93A3A;--line:#DDE0E6;--logo:#2A2F3B;--glow1:#C9D8FF;--glow2:#D3EFE9;
 --mono:'JetBrains Mono',ui-monospace,Consolas,'Courier New',monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#07090D;--win:#0C0E12;--fg:#D4D8DF;--dim:#7D8492;--w:#FFFFFF;--hl:#4AA3FF;--ok:#5FD38D;--err:#FF7A7A;--line:#222733;--logo:#C9CCD3;--glow1:#17264F;--glow2:#0A2630}}
:root[data-theme="dark"]{--page:#07090D;--win:#0C0E12;--fg:#D4D8DF;--dim:#7D8492;--w:#FFFFFF;--hl:#4AA3FF;--ok:#5FD38D;--err:#FF7A7A;--line:#222733;--logo:#C9CCD3;--glow1:#17264F;--glow2:#0A2630}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:radial-gradient(900px 520px at 12% -4%,var(--glow1),transparent 62%),radial-gradient(800px 460px at 100% 100%,var(--glow2),transparent 60%),var(--page);color:var(--fg);font:14px/1.55 var(--mono);display:flex;flex-direction:column;align-items:center;padding:28px 28px 10px}
.win{flex:1;min-height:0;width:min(1200px,100%);background:var(--win);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);color:var(--dim);font-size:13px}
.ctl{margin-left:auto;display:flex;align-items:center;gap:26px}
.main{flex:1;overflow:auto;padding:22px 26px}
.sb{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.sb .wx,.sb .clk{display:flex;align-items:center;gap:10px}
.ib{background:none;border:0;color:var(--dim);cursor:pointer;padding:3px;display:inline-flex}.ib:hover{color:var(--w)}
.foot{padding:12px 8px 6px;font-size:12px;color:var(--dim);text-align:center}
.ln{white-space:pre;min-height:1.55em}
.logo{display:block;color:var(--logo);line-height:1.2;font-size:clamp(6px,2.4vw,15px);margin:6px 0}
.dim{color:var(--dim)}.w{color:var(--w);font-weight:700}.hl{color:var(--hl)}.ok{color:var(--ok)}.err{color:var(--err)}
a{color:var(--hl)}
.c{color:var(--hl);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}.c:hover{color:var(--w)}
.pr{display:flex;gap:8px;align-items:center}.pr label{color:var(--w);font-weight:700;white-space:nowrap}
#cmd{flex:1;min-width:0;background:none;border:0;color:var(--w);font:inherit;caret-color:var(--w);padding:0}#cmd:focus{outline:none}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.win{transition:opacity .3s,transform .3s}.win.gone{opacity:0;transform:translateY(40px) scale(.94);pointer-events:none;visibility:hidden;transition:opacity .3s,transform .3s,visibility 0s .3s}
.dock{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--win);border:1px solid var(--line);color:var(--fg);font:13px var(--mono);padding:9px 16px;border-radius:10px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:5}
.dock:hover{border-color:var(--hl)}
.off{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dim);line-height:2;z-index:4}
.off button{margin-top:6px;background:none;border:1px solid var(--line);color:var(--fg);font:inherit;padding:6px 14px;border-radius:8px;cursor:pointer}.off button:hover{border-color:var(--hl);color:var(--w)}
.dock[hidden],.off[hidden]{display:none}
.desk{position:fixed;inset:0;z-index:3;overflow:hidden;background:var(--page);display:flex;justify-content:space-between;align-items:flex-start;padding:calc(36px + env(safe-area-inset-top,0px)) 36px 90px;animation:deskin .4s ease both}
.desk[hidden]{display:none}
.desk::before{content:"";position:absolute;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(600px 420px at 28% 30%,var(--glow1),transparent 60%),radial-gradient(520px 420px at 76% 72%,var(--glow2),transparent 60%);animation:drift 26s ease-in-out infinite alternate}
@keyframes deskin{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6%,4%) scale(1.15)}}
.dicons{display:flex;flex-direction:column;gap:14px}
.dic{width:92px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px;border:1px solid transparent;border-radius:10px;background:none;color:var(--fg);font:12px var(--mono);text-decoration:none;text-align:center;cursor:pointer}
.dic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dic:hover,.dic:focus-visible{background:color-mix(in srgb,var(--hl) 14%,transparent);border-color:color-mix(in srgb,var(--hl) 40%,transparent)}
.dclock{text-align:right;user-select:none}
#dtime{font:300 clamp(44px,7vw,84px)/1 var(--mono);letter-spacing:-.03em;color:var(--w)}
#ddate{margin-top:8px;font-size:14px;color:var(--dim)}
@media (max-width:640px){.desk{flex-direction:column-reverse;justify-content:flex-end;gap:26px;padding:calc(28px + env(safe-area-inset-top,0px)) 20px 90px}.dclock{text-align:left}.dicons{flex-direction:row;flex-wrap:wrap;gap:6px}}
@media (prefers-reduced-motion:reduce){.desk,.desk::before{animation:none}}
.ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.bar{min-width:0}
@supports (height:100dvh){html,body{height:100dvh}}
@media (max-width:480px){#date{display:none}}
.wr{display:block;white-space:normal}.wr.bl{padding-left:2ch;text-indent:-2ch}
svg.lgsvg{display:block;width:min(100%,387px);height:auto;margin:8px 0;max-width:100%}
.lgsvg rect{fill:var(--logo);stroke:var(--win);stroke-width:.7}.lgsvg path{fill:none;stroke:var(--logo);stroke-width:1.1}
.nfw{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.nfw .lgsvg{width:min(100%,300px);margin:0}.nfi{white-space:pre}
.ln{white-space:pre}
@media (max-width:640px){.ln{white-space:pre-wrap}#cmd{font-size:16px}.ctl{gap:14px;flex-shrink:0}.dock{max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}body{padding:0}.win{border-radius:0;border:0;width:100%}.main{padding:12px 14px;font-size:11.5px}}
</style>
