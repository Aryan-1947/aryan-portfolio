/* ---------- Milli ---------- */
#milli{--b1:color-mix(in srgb,var(--hl) 42%,#fff);--b2:color-mix(in srgb,var(--hl) 90%,#0a1630);--edge:color-mix(in srgb,var(--hl) 50%,#0a1630);--ink:#0b1424;--cheek:#ff9db5;--mg:color-mix(in srgb,var(--hl) 50%,transparent);position:fixed;right:20px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:104px;z-index:6;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:opacity .6s}
#milli:not(.on){opacity:0}
#milli[hidden]{display:none}
#milli:focus-visible{outline-offset:6px;border-radius:20px}

#mveil.on{opacity:1;visibility:visible;transition:opacity .6s}
#mveil span{font-size:12px;color:var(--dim)}
#ms{display:block;width:100%;height:auto;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 8px var(--mg));transition:opacity .6s}
#ms .mbody{pointer-events:visiblePainted;cursor:pointer;transform-box:view-box;transform-origin:60px 118px;transition:transform .3s}
#ms .antg{transform-box:view-box;transform-origin:60px 44px;transition:transform .6s}
#ms .stem{fill:none;stroke:var(--edge);stroke-width:3;stroke-linecap:round}
#ms .lf{fill:url(#mgl);stroke:var(--edge);stroke-width:1.6;stroke-linejoin:round;transform-box:view-box;transform-origin:60px 34px;transition:transform .5s}
#ms .bd{fill:url(#mgb);stroke:var(--edge);stroke-width:2.5}
#ms .shine{fill:#fff;opacity:.5}
#ms .ft{fill:var(--edge)}
#ms .arm{fill:url(#mgl);stroke:var(--edge);stroke-width:2;transform-box:fill-box;transform-origin:center;transition:transform .3s}
#ms .eyes{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .18s ease-out}
#ms .eo{fill:var(--ink);transform-box:fill-box;transform-origin:center;transition:transform .1s,opacity .15s}
#ms .gl{fill:#fff}
#ms .ec,#ms .es{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;opacity:0;transition:opacity .15s}
#ms .mth{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
#ms .m1,#ms .m2,#ms .m3{transition:opacity .12s}
#ms .m2,#ms .m3{opacity:0}
#ms .m2 path,#ms .m3{fill:var(--ink);stroke:none}
#ms .m3{transform-box:fill-box;transform-origin:center}
#ms .tg{fill:#ff8aa6}
#ms .bsh{fill:var(--cheek);opacity:.5;transform-box:fill-box;transform-origin:center;transition:opacity .25s,transform .25s}
#ms .msp{fill:color-mix(in srgb,var(--hl) 40%,#fff);animation:msp 2.4s ease-in-out infinite}
#ms .msh{fill:var(--hl);opacity:.14;transform-box:view-box;transform-origin:60px 130px;animation:msh 3.4s ease-in-out infinite alternate}
#ms .mfl{animation:mfl 3.4s ease-in-out infinite alternate}
@keyframes mfl{to{transform:translateY(-4px)}}
@keyframes msh{to{transform:scale(.86);opacity:.09}}
@keyframes msp{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes mbp1{0%{transform:none}25%{transform:scale(1.12,.82)}55%{transform:scale(.95,1.08)}100%{transform:none}}
@keyframes mhop{0%,100%{transform:none}30%{transform:translateY(-14px) scale(.96,1.05)}58%{transform:scale(1.06,.94)}}
@keyframes mwg{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}45%{transform:rotate(12deg)}70%{transform:rotate(-8deg)}}

@keyframes mt1{0%{opacity:1}50%{opacity:0}}
@keyframes mt2{0%{opacity:0}50%{opacity:1}}
#milli.talk:is([data-s=idle],[data-s=curious],[data-s=intro]) .m1{animation:mt1 .4s steps(1,end) infinite}
#milli.talk:is([data-s=idle],[data-s=curious],[data-s=intro]) .m2{animation:mt2 .4s steps(1,end) infinite}
#milli.bp .mbody{animation:mbp1 .5s cubic-bezier(.3,1.6,.5,1)}

#milli[data-s=intro] .mbody{animation:mswy 2.6s ease-in-out infinite}

#milli[data-s=cheer] .mbody{animation:mch .5s ease-in-out infinite}

#milli[data-s=tickle] .mbody{animation:mshy .3s ease-in-out infinite}
#milli[data-s=tickle] .antg,#milli[data-s=cheer] .antg{animation:mwg .35s ease-in-out infinite}
#milli[data-s=startled] .eo{transform:scale(1.18)}
#milli[data-s=startled] .lf{transform:scale(1.18)}
#milli[data-s=drowsy] .eo{transform:scaleY(.42)}
#milli[data-s=drowsy] .ll{transform:rotate(-26deg)}
#milli[data-s=drowsy] .lr{transform:rotate(26deg)}
#milli[data-s=asleep] .ll{transform:rotate(-46deg)}
#milli[data-s=asleep] .lr{transform:rotate(46deg)}
#milli[data-s=asleep] .mbody{animation:mbr 3.6s ease-in-out infinite}
#milli[data-s=asleep] .mfl{animation-duration:6s}
#milli[data-s=asleep] #ms{opacity:.82}
#milli:is([data-s=happy],[data-s=giggle],[data-s=tickle],[data-s=cheer]) .eo,#milli[data-s=asleep] .eo{opacity:0}
#milli:is([data-s=happy],[data-s=giggle],[data-s=tickle],[data-s=cheer]) .ec{opacity:1}
#milli[data-s=asleep] .es{opacity:1}
#milli:is([data-s=happy],[data-s=giggle],[data-s=tickle],[data-s=cheer]) .m1,#milli:is([data-s=startled],[data-s=asleep]) .m1{opacity:0}
#milli:is([data-s=happy],[data-s=giggle],[data-s=tickle],[data-s=cheer]) .m2,#milli:is([data-s=startled],[data-s=asleep]) .m3{opacity:1}
#milli[data-s=asleep] .m3{transform:scale(.55)}
#milli:is([data-s=happy],[data-s=tickle],[data-s=cheer]) .al{transform:translateY(-9px) rotate(-25deg)}
#milli:is([data-s=happy],[data-s=tickle],[data-s=cheer]) .ar{transform:translateY(-9px) rotate(25deg)}
#milli:is([data-s=happy],[data-s=tickle],[data-s=cheer]) .bsh{opacity:.9;transform:scale(1.15)}
#milli[data-s=giggle] .bsh{opacity:.95;transform:scale(1.2)}
#milli[data-s=asleep] .bsh{opacity:.5}

 if(DUR[s])tSt=setTimeout(()=>{const e=END[s];go(s==='drowsy'?'asleep':'idle');if(e&&st==='idle')e()},DUR[s]);
 return 1}
function poke(){last=Date.now();cAt=last+18000+Math.random()*5000;if(st==='drowsy'&&!introOn){go('idle');say(pick(Ls.perk,'perk'))}}
function wake(){go('startled');cls('hop',650);say(pick(Ls.wake,'wake'));sparkle(2);setTimeout(()=>{if(st==='idle'&&!introOn)nudge()},3600)}
function boop(tk){if(introOn)return skip();last=Date.now();cAt=last+22000;
 if(st==='asleep')return wake();
 const n=Date.now();boops=boops.filter(t=>n-t<6000);boops.push(n);total++;cls('bp',520);
 if(st==='giggle'){sparkle(1);return}
 if(tk){go('tickle');sparkle(2);return say(pick(Ls.tick,'tick'))}
 if(boops.length>=7){boops=[];go('giggle');sparkle(4);return say(pick(Ls.giggle,'giggle'),3200)}
 go('happy');sparkle(1+(Math.random()*2|0));
 if(total%4===0)return say('Hee hee! Do you need any help?',0,0,{chips:HC()});
 const m=Ls.ms[total];say(m||pick(Ls.boop,'boop'),m?3400:0)}

/* suggests commands the visitor hasn't opened yet */
function nudge(){const p=ORDER.filter(x=>!vis.has(x));let t,ch=null;
 if(p.length){const k=p[nn%p.length],o=p.length>1?p[(nn+1)%p.length]:null;t=Ls.nudge[k];ch=[[k,k]];if(o&&o!==k)ch.push([o,o]);ch.push(['help','help'])}
 else if(nn%2===0){t='You’ve seen everything! Want to say hi to Aryan?';ch=[['contact','contact'],['resume','resume']]}
 else t=pick(Ls.chat,'chat');
 nn++;go('curious');say(t,0,0,{chips:ch||undefined})}
function ask(){go('curious');say('Need any help? I can show you around.',0,0,{chips:HC()})}

/* introduction: big in the middle over a blurred glass veil, then she shrinks and walks to her corner */
function place(){const r=R.getBoundingClientRect(),W=innerWidth,Hh=innerHeight,sc=Math.min(250,W*.58)/r.width,cx=W/2,cy=Math.max(Hh*.4,r.height*sc/2+20);
 R.style.setProperty('--tx',cx-(r.left+r.width/2)+'px');R.style.setProperty('--ty',cy-(r.top+r.height/2)+'px');R.style.setProperty('--sc',sc);R.style.setProperty('--bt',cy+r.height*sc/2+8+'px')}
function intro(rep){if(introOn)return ['Milli is already introducing herself.'];
 if(gone){gone=false;LS('mh','0');R.hidden=false}
 tI.forEach(clearTimeout);tI=[];hush();introOn=true;R.classList.add('on');place();
 if(rep){R.classList.remove('nt');void R.offsetWidth;R.classList.add('intro')}
 VE.classList.add('on');go('intro',1);look(-2.6,2.4);LS('mv','1');
 const S=(rep||!seen)?Ls.intro:Ls.introB,e=S[S.length-1];
 S.forEach(([t,d,m],i)=>tI.push(setTimeout(()=>{say(t,m,1);if(i===1)look(0,0);if(i===2)sparkle(2)},d)));
 tI.push(setTimeout(finish,e[1]+e[2]+500));
 return ['',D('Milli is walking to the middle of the screen...')]}
function finish(){if(!introOn)return;introOn=false;tI.forEach(clearTimeout);tI=[];hush();look(0,0);VE.classList.remove('on');
 tI.push(setTimeout(()=>{R.classList.remove('nt');void R.offsetWidth;R.classList.remove('intro');go('happy',1);last=Date.now();cAt=last+25000},260));
 tI.push(setTimeout(ask,2000))}
const skip=()=>finish();

/* events coming from the terminal / page */
function ev(k,a,b){
 if(k==='cmd'){const s=a==='cat'?(b||'').replace(/\.(md|txt)$/,''):a==='open'?(/^resume$/i.test(b||'')?'resume':'projects'):a;if(ORDER.includes(s))vis.add(s);cAt=Date.now()+22000}
 if(gone||introOn)return;
 if(st==='asleep'){if(k==='cmd'&&a!=='milli'&&a!=='intro'&&Date.now()-stalk>20000){stalk=Date.now();say(pick(Ls.stalk,'stalk'),0,0,{q:1})}return}
 switch(k){
  case 'cmd':{if(a==='milli'||a==='intro')return;
   if(a==='sudo'&&/hire/i.test(b||'')){go('cheer');sparkle(5);return say(pick(Ls.hire,'hire'),3800)}
   let t;if(a==='projects'||a==='open'){const s=(b||'').toLowerCase(),p=PROJ[/^\d+$/.test(s)?+s-1:PROJ.findIndex(x=>x.id===s||x.alias===s)];if(p)t=Ls.proj[p.id]}
   t=t||pick(Ls.cmd[a]||Ls.cmd.def,'c'+a);if(st!=='giggle')go('curious');say(t);break}
  case 'unk':go('curious');say(pick(Ls.unk,'unk'));break;
  case 'tour':go('curious');say(a<0?'Aw, leaving the tour? No worries!':a>4?'That was fun! Thanks for walking with me.':Ls.tour[a],3600);break;
  case 'theme':if(a==='light'){go('startled');say(pick(Ls.light,'light'))}else{go('curious');say(pick(Ls.dark,'dark'))}break;
  case 'min':say('I’ll keep the desktop company.');break;
  case 'restore':go('happy');say('Back to the terminal!');break;
  case 'close':say('Aww, session closed? I’ll wait right here.');break;
  case 'reopen':go('cheer');sparkle(3);say('Yay, you’re back!');break}}

function ctl(a){const o=[D('$ milli '+esc(a||'--about')),''];
 if(a==='sleep'){if(!introOn)go('asleep');return [...o,'Milli curls up for a nap.']}
 if(a==='wake'){if(st==='asleep')wake();else say('I’m already awake!');return [...o,'Milli stretches.']}
 if(a==='mute'||a==='unmute'){muted=a==='mute';LS('mm',muted?'1':'0');if(muted)hush();else say('I’m chatty again!');return [...o,muted?'Milli will stay quiet. She’ll still wiggle.':'Milli is chatty again.']}
 if(a==='hide'||a==='show'){gone=a==='hide';LS('mh',gone?'1':'0');R.hidden=gone;if(gone)hush();else{R.classList.add('on');cls('hop',650);say('Hi again!')}return [...o,gone?'Milli went for a walk. Type '+C('milli show')+' to bring her back.':'Milli is back!']}
 return [...o,H('Milli')+' '+D('· tiny desk assistant'),'  No LLM inside. Every line is pre-written,','  and a small state machine decides when to say it.','',
  '  '+D('boop')+'     click or tap her. Tickle her leaf too.','  '+D('nap')+'      leave her alone for a minute and she dozes off.','  '+D('wake')+'     boop her to wake her up.','',
  'options  '+['sleep','wake','mute','unmute','hide','show'].map(x=>C('milli '+x,x)).join('  '),...next(C('intro'),C('about'))]}

/* wiring */
R.addEventListener('click',e=>boop(!!e.target.closest('.mah')));
R.addEventListener('mousedown',e=>e.preventDefault());
R.addEventListener('keydown',e=>{if(e.target===R&&(e.key==='Enter'||e.key===' ')){e.preventDefault();boop(0)}});
VE.addEventListener('click',skip);
B.addEventListener('click',e=>{if(e.target.closest('button')||!B.classList.contains('act'))return;const b=B.querySelector('.ch button');b&&b.click()});
B.addEventListener('mouseenter',()=>{if(B.classList.contains('act'))clearTimeout(tB)});
B.addEventListener('mouseleave',()=>{if(B.classList.contains('act')&&B.classList.contains('on')){clearTimeout(tB);tB=setTimeout(hush,2500)}});
['keydown','pointerdown','wheel','touchstart'].forEach(n=>addEventListener(n,poke,{passive:true}));
addEventListener('keydown',e=>{if(e.key==='Escape'&&introOn)skip()});
addEventListener('resize',()=>{if(introOn)place()});
addEventListener('pointermove',e=>{poke();if(rm||st==='asleep'||introOn||Date.now()<lk||raf)return;px=e.clientX;py=e.clientY;raf=requestAnimationFrame(()=>{raf=0;const r=R.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.6;look(Math.max(-3.4,Math.min(3.4,(px-cx)/80)),Math.max(-2.4,Math.min(2.6,(py-cy)/80)))})},{passive:true});
cmd.addEventListener('input',()=>{if(rm||st==='asleep'||introOn)return;lk=Date.now()+1500;look(-3.2,1.6);clearTimeout(tL);tL=setTimeout(()=>look(0,0),1500)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(!gone&&!introOn&&st==='idle'&&Date.now()-hiddenAt>25000){last=Date.now();cAt=last+18000;go('happy');say(pick(Ls.back,'back'))}});
setInterval(()=>{if(gone||introOn||document.hidden)return;const n=Date.now();
 if(st==='asleep'){if(n>mAt){mAt=n+26000+Math.random()*14000;say(pick(Ls.mutter,'mut'),0,0,{q:1})}return}
 if(st!=='idle')return;
 if(n-last>55000){go('drowsy');say(pick(Ls.drowsy,'drowsy'),0,0,{q:1})}
 else if(n>cAt){cAt=n+25000;nudge()}},1000);
function blink(){if(st!=='asleep'&&!/^(happy|giggle|tickle|cheer)$/.test(st)){cls('bk',130);if(Math.random()<.2)setTimeout(()=>cls('bk',130),240)}setTimeout(blink,2200+Math.random()*3800)}
function fid(){if(st==='idle'&&!gone&&!rm){const r=Math.random();
 if(r<.3){look(-3,-1.2);setTimeout(()=>look(3,-1.2),650);setTimeout(()=>look(0,0),1350)}
 else if(r<.5)cls('hop',650);else if(r<.7)cls('wg',900);
 else if(r<.85){fx('♪',{x:72,y:10,dx:16,d:2.2});setTimeout(()=>fx('♪',{x:60,y:14,dx:-14,d:2.2}),420)}else fx('✦')}
 setTimeout(fid,4500+Math.random()*5500)}
if(gone){R.hidden=true;R.classList.remove('intro','nt');st='idle';R.dataset.s='idle'}
else{st='intro';place();setTimeout(()=>intro(),700)}
blink();fid();
return {ev,ctl,intro}})();

paint();
banner();cmd.focus({preventScroll:true});
</script>
</body>
